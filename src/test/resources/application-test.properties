spring.datasource.url=jdbc:h2:mem:employee_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# JWT: claves exclusivas para pruebas
app.security.jwt.private-key-location=classpath:keys/test-private.pem
app.security.jwt.public-key-location=classpath:keys/test-public.pem