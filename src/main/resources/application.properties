spring.application.name=employee-management-api

# ========================================
# DATABASE - MySQL
# ========================================
# CONEXIÓN CON VERSIONES RECIENTES Y ACTIVO LOCAL PARA CARGAR CREDENCIALES

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ========================================
# LOGICA - CONFIG. ZONA HORARIA LIMA
# ========================================
spring.jackson.time-zone=America/Lima
# ========================================
# "No conviertas mis nombres de columnas. Utiliza exactamente los nombres que he definido."
# PERMITE TRABAJAR CON LOS NOMBRES DE LAS COLUMNAS DEFINIDAS,SINO CAMBIA de camelCase a last_name
# ========================================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ========================================
# HIKARI CONNECTION POOL- PERMITE MANTENER UN CONJUNTO DE CONEXIONES REUTILIZABLES Y NO CREAR UNA NUEVA
# ========================================
spring.datasource.hikari.maximum-pool-size=10

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database=MYSQL

# ========================================
# SERVER
# ========================================
server.port=8080

# JWT: claves RSA persistentes
app.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
app.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}