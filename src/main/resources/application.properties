spring.application.name=employee-management-api

# ========================================
# DATABASE - MySQL
# ========================================
# CONEXIÓN CON VERSIONES RECIENTES
spring.datasource.url=jdbc:mysql://localhost:3306/bd_employee_management?serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3306/bd_employee_management?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=jara
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ========================================
# LOGICA - CONFIG. ZONA HORARIA LIMA
# ========================================
spring.jackson.time-zone=America/Lima
# ========================================
# "No conviertas mis nombres de columnas. Utiliza exactamente los nombres que he definido."
# PERMITE TRABAJAR CON LOS NOMBRES DE LAS COLUMNAS DEFINIDAS,SINO CAMBIA de camelCase a last_name
# ========================================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ========================================
# HIKARI CONNECTION POOL- PERMITE MANTENER UN CONJUNTO DE CONEXIONES REUTILIZABLES Y NO CREAR UNA NUEVA
# ========================================
spring.datasource.hikari.maximum-pool-size=10

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database=MYSQL

# ========================================
# SERVER
# ========================================
server.port=8080